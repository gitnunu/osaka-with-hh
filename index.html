<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f4ed">
  <title>OSAKA NOTE — 내 오사카 지도</title>
  <style>
    :root{--paper:#f7f4ed;--ink:#20251f;--muted:#74786e;--green:#315747;--orange:#db754e;--line:#e6e1d7}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
    .wrap{max-width:1280px;margin:auto;padding:22px 24px 28px}.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;letter-spacing:.12em}.brand{font-weight:800;color:var(--green);letter-spacing:.18em}
    header{padding:32px 0 20px;display:flex;justify-content:space-between;align-items:end;gap:20px}.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--orange);font-weight:800}h1{font:500 clamp(36px,6vw,62px)/1 Georgia,serif;letter-spacing:-.045em;margin:10px 0}header p{color:var(--muted);margin:0;font-size:14px}
    .buttons{display:flex;gap:9px;flex-wrap:wrap}.button{display:inline-block;border:1px solid var(--green);background:var(--green);color:white;text-decoration:none;border-radius:999px;padding:10px 15px;font-size:12px;font-weight:700}.button.secondary{background:transparent;color:var(--green)}
    .mapbox{height:min(72vh,780px);min-height:430px;background:#e8e6df;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 12px 35px #3542350b}.mapbox iframe{width:100%;height:100%;border:0}
    .foot{display:flex;justify-content:space-between;gap:18px;color:var(--muted);font-size:11px;margin-top:13px}.foot strong{color:var(--green)}
    @media(max-width:650px){.wrap{padding:16px 14px 22px}header{display:block;padding:28px 0 17px}.buttons{margin-top:16px}.mapbox{height:70vh;min-height:400px;border-radius:14px}.top span:last-child{display:none}.foot{display:block}.foot span{display:block;margin-top:5px}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top"><span class="brand">OSAKA NOTE</span><span>MY SAVED PLACES · 2026</span></div>
    <header>
      <div><div class="eyebrow">MINAMI · NAMBA · NIPPONBASHI</div><h1>내가 저장한 오사카</h1><p>Google My Maps에 직접 표시한 장소만 이 지도에서 확인할 수 있어요.</p></div>
      <nav class="buttons" aria-label="지도 링크"><a class="button" href="https://www.google.com/maps/d/edit?mid=1s5inQFu1AG5c9cI9uOVdT1VI06qNtmQ&amp;usp=sharing" target="_blank" rel="noreferrer">내 지도 편집 ↗</a><a class="button secondary" href="https://www.google.com/maps/d/viewer?mid=1s5inQFu1AG5c9cI9uOVdT1VI06qNtmQ" target="_blank" rel="noreferrer">Google 지도에서 열기 ↗</a></nav>
    </header>
    <section class="mapbox" aria-label="내가 저장한 오사카 장소 지도">
      <iframe src="https://www.google.com/maps/d/embed?mid=1s5inQFu1AG5c9cI9uOVdT1VI06qNtmQ" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen title="내가 저장한 오사카 장소"></iframe>
    </section>
    <footer class="foot"><strong>지도에 추가한 핀을 수정하면 이 화면에도 반영됩니다.</strong><span>지도가 표시되지 않으면 My Maps 공유 설정에서 공개 또는 링크가 있는 사용자에게 보기 권한을 허용해 주세요. 이 홈페이지는 공개 페이지입니다.</span></footer>
  </main>
</body>
</html>
